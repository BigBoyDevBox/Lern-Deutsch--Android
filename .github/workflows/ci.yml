# CI: prove every push to main and every PR — the vocabulary pipeline, unit
# tests, Android lint, and a debug APK uploaded as a rolling artifact.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vocabulary:
    name: Vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Two separate claims:
      #   validate — the word list obeys the app's rules (articles match
      #     genders, no ß, every curated Wortart word still exists, …)
      #   --check  — the committed vocab.json is what the generator produces
      #     from the committed vocab.py, i.e. nobody edited one without the
      #     other. The Pebble app has no equivalent gate and its awesome.md
      #     lists exactly this drift as an open issue (2.5).
      - name: Validate the word list
        run: python3 tools/validate_vocab.py

      - name: Check vocab.json is freshly generated
        run: python3 tools/gen_vocab.py --check

  android:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No explicit SDK install step: the ubuntu runner image ships the Android
      # SDK, and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # The release variant is the only one that runs R8, and R8 failures are
      # invisible until they aren't: a missing keep rule for a serialization
      # entry point crashes at runtime, in a build nobody made until the tag
      # was already pushed. Two extra minutes here means every PR proves the
      # APK a learner would actually install still builds and shrinks.
      - name: Assemble release (proves R8 / minification)
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wortkatze-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
